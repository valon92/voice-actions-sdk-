<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient matching demo page (purple to pink) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background matching demo page style -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Microphone icon - simplified to match emoji 🎤 style -->
  <!-- Main microphone body - simple and clear like emoji -->
  <rect x="30" y="20" width="40" height="50" rx="8" fill="#FFFFFF"/>
  
  <!-- Microphone grille - simple horizontal lines -->
  <rect x="34" y="24" width="32" height="3" rx="1.5" fill="#9CA3AF" opacity="0.5"/>
  <rect x="34" y="30" width="32" height="3" rx="1.5" fill="#9CA3AF" opacity="0.5"/>
  <rect x="34" y="36" width="32" height="3" rx="1.5" fill="#9CA3AF" opacity="0.5"/>
  
  <!-- Microphone stand -->
  <rect x="45" y="70" width="10" height="10" rx="3" fill="#FFFFFF"/>
  
  <!-- Microphone base - elliptical -->
  <ellipse cx="50" cy="85" rx="18" ry="7" fill="#FFFFFF"/>
  
  <!-- Sound waves - simple curved lines like emoji -->
  <path d="M 10 30 Q 5 25, 0 30" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 10 50 Q 5 45, 0 50" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 90 30 Q 95 25, 100 30" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 90 50 Q 95 45, 100 50" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
